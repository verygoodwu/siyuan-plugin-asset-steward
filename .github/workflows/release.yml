name: Build release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES_CURRENT.md
